# Reglas por lugar (las aplica ~/.config/hypr/scripts/lugar.sh al CAMBIAR de Wi-Fi).
#   nombre de la Wi-Fi | lugar | energía | volumen | no molestar
#   energía: ahorro · equilibrado · rendimiento · -      volumen: 0-100 (bocinas) · -      no molestar: si · no · -
#   «-» = no tocar. La línea con * vale para cualquier red que no esté en la lista.
# Ver el nombre exacto de tu red:  nmcli -t -f active,ssid dev wifi | grep '^yes'

DEISY_SOTO | casa | - | - | no

# Ejemplo para la universidad (pon el nombre real de su Wi-Fi y quita el #):
# NombreWifiUniversidad | universidad | ahorro | 0 | no

# Cualquier otra red (calle, universidad, casa de alguien): bocinas en silencio para que nada suene de golpe
* | fuera de casa | - | 0 | -
