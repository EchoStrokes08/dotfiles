# keyd: capas de teclado para TODO el sistema (también la TTY y la pantalla de login).
# Vive en /etc/keyd/default.conf (lo copia instalar/sistema-base.sh). Tras editarlo:  sudo keyd reload
# ¿Qué tecla es cuál?  sudo keyd monitor      Salida de emergencia: Retroceso + Esc + Enter a la vez
#
#   Bloq Mayús, un toque        → Esc
#   Bloq Mayús mantenida        → Ctrl  (Bloq Mayús + C = copiar, + T = pestaña nueva…)
#   Bloq Mayús + H J K L        → ← ↓ ↑ →   (flechas sin mover la mano; con Shift selecciona)
#   Bloq Mayús + Y U I O        → Inicio · Av Pág · Re Pág · Fin
#   Shift + Bloq Mayús          → el Bloq Mayús de verdad (MAYÚSCULAS)
#
# keyd junta todos los teclados en uno virtual: el Bloq Mayús ya no puede quedar "pegado" en un
# teclado y no en el otro. Para volver a como estaba:  sudo systemctl disable --now keyd

[ids]
*

[main]
capslock = overload(nav, esc)

[shift]
capslock = capslock

# ":C" = mientras la capa está activa, las teclas que NO se listan aquí llevan Ctrl
[nav:C]
h = left
j = down
k = up
l = right
y = home
u = pagedown
i = pageup
o = end
