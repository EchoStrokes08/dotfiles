; gamemode: lo activan Sober (enable_gamemode) y Steam (opción de lanzamiento «gamemoderun %command%»)
; Comprobar: gamemoded -s   ·   Probar: gamemoded -t
[general]
desiredgov=performance
; prioridad de CPU para el juego (el renice necesita estar en el grupo «gamemode»)
renice=10
softrealtime=off   ; SCHED_ISO no existe en este kernel: solo daba errores
ioprio=0
inhibit_screensaver=1

[cpu]
park_cores=no
pin_cores=no

[custom]
; perfil de energía «performance» y GPU a reloj máximo mientras se juega (ver el script)
start=~/.config/hypr/scripts/juego-energia.sh inicio
end=~/.config/hypr/scripts/juego-energia.sh fin
script_timeout=10
