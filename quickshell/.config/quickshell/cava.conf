# cava para el visualizador de la barra (BarraDerecha.qml lo lanza solo mientras suena música).
# Salida «raw» en texto: una línea por fotograma con 10 valores 0-100 separados por «;».
[general]
bars = 10
framerate = 30
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
