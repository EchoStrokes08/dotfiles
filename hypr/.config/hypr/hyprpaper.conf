# hyprpaper solo carga el último wallpaper elegido (enlace que mantiene scripts/wallpaper.sh).
# La rotación cada 10 min la hace Hyprland en modulos/tema.lua, para que los colores
# del modo "wallpaper" cambien a la vez que el fondo.
wallpaper {
    monitor = eDP-1
    path = ~/.local/state/tema/wallpaper
    fit_mode = cover
}

splash = false
