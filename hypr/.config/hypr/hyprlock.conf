#  ╭──────────────────────────────────────────────────────────╮
#  │                 HYPRLOCK · Ayu Dark Glass                │
#  ╰──────────────────────────────────────────────────────────╯
#  Paleta Ayu
#    fondo    0b0e14     texto    e5e1cf     tenue   5c6773
#    naranja  f19618     azul     36a3d9     verde   c2d94c
#    amarillo e6c446     rojo     ff3333     rosa    f07178
#  Nota: dentro de los textos, "##" escribe un "#" literal
#  (un "#" solo empieza un comentario).

general {
    hide_cursor = true
    ignore_empty_input = true      # Enter sin escribir no cuenta como intento
    grace = 0                      # segundos en los que basta mover el ratón para desbloquear
}

# Animaciones suaves al entrar y salir, y en el campo de contraseña (hyprlock ≥ 0.7)
animations {
    enabled = true
    bezier = suave, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 6, suave
    animation = fadeOut, 1, 6, suave
    animation = inputFieldDots, 1, 2, suave
    animation = inputFieldColors, 1, 5, suave
}


# ─────────────────────────── FONDO ───────────────────────────
background {
    monitor =                      # vacío = todos los monitores
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.012                  # grano fino: evita el banding del desenfoque
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}


# ─────────────────────────── SALUDO ──────────────────────────
label {
    monitor =
    text = cmd[update:60000] h=$(date +%H); if [ $h -lt 6 ]; then s="Dulces sueños"; elif [ $h -lt 13 ]; then s="Buenos días"; elif [ $h -lt 20 ]; then s="Buenas tardes"; else s="Buenas noches"; fi; echo "<i>$s, <b>$USER</b></i>"
    color = rgba(e5e1cfb3)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 330
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000088)
}


# ─────────────────── RELOJ APILADO (HH / MM) ─────────────────
# Horas en naranja
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = rgb(f19618)
    font_size = 140
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(f1961840)  # resplandor del mismo color
    shadow_boost = 1.2
}

# Minutos en azul
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = rgb(36a3d9)
    font_size = 140
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 65
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(36a3d940)
    shadow_boost = 1.2
}

# Barrita decorativa con el degradado de tus bordes
shape {
    monitor =
    size = 70, 4
    color = rgba(e5e1cf00)
    rounding = -1
    border_size = 2
    border_color = rgb(f19618) rgb(36a3d9) 0deg
    position = 0, -30
    halign = center
    valign = center
}

# Fecha: espaciada y en mayúsculas, tipo póster
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='4096'>$(LC_TIME=es_MX.UTF-8 date +'%^A · %d %^B')</span>"
    color = rgba(e5e1cfcc)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -65
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000099)
}


# ──────────────────────── CONTRASEÑA ─────────────────────────
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    rounding = -1                  # píldora completa

    outer_color = rgb(f19618) rgb(36a3d9) 135deg
    inner_color = rgba(0b0e14d9)   # cristal oscuro
    font_color = rgb(e5e1cf)
    font_family = JetBrainsMono Nerd Font

    check_color = rgb(e6c446) rgb(f19618) 120deg   # verificando
    fail_color = rgb(ff3333) rgb(f07178) 45deg     # contraseña incorrecta
    capslock_color = rgb(c2d94c) rgb(36a3d9) 135deg

    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1

    placeholder_text = <span foreground="##5c6773"><i>  contraseña…</i></span>
    fail_text = <span foreground="##f07178"><b>$FAIL</b>  <i>($ATTEMPTS)</i></span>
    fail_timeout = 2500

    fade_on_empty = false
    hide_input = false

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(00000099)

    position = 0, -170
    halign = center
    valign = center
}

# Aviso de Bloq Mayús, justo debajo del campo
label {
    monitor =
    text = cmd[update:500] [ "$(cat /sys/class/leds/*capslock*/brightness 2>/dev/null | head -n1)" = "1" ] && echo "<span foreground='##c2d94c'>󰪛  Bloq Mayús activado</span>" || echo ""
    color = rgb(c2d94c)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -225
    halign = center
    valign = center
}


# ───────────────────────── BARRA INFERIOR ────────────────────
# Izquierda: batería y distribución de teclado
label {
    monitor =
    text = cmd[update:10000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$b" ] && echo "<span foreground='##c2d94c'>󰁹</span> $b%    <span foreground='##36a3d9'>󰌌</span> $LAYOUT" || echo "<span foreground='##36a3d9'>󰌌</span> $LAYOUT"
    color = rgba(e5e1cfb3)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 40, 35
    halign = left
    valign = bottom
}

# Centro: candado
label {
    monitor =
    text = <span foreground="##f19618">󰌾</span>  <span letter_spacing="2048">BLOQUEADO</span>
    color = rgba(e5e1cf80)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 35
    halign = center
    valign = bottom
}

# Derecha: lo que está sonando (playerctl), vacío si no hay nada
label {
    monitor =
    text = cmd[update:2000] m=$(playerctl metadata --format '{{artist}} — {{title}}' 2>/dev/null | cut -c1-45); [ -n "$m" ] && echo "<span foreground='##f19618'>󰝚</span>  <i>$m</i>" || echo ""
    color = rgba(e5e1cfb3)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -40, 35
    halign = right
    valign = bottom
}

