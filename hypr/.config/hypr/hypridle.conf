#  HYPRIDLE · qué pasa cuando no tocas el equipo
general {
    lock_cmd = pidof hyprlock || hyprlock       # lo que hace "loginctl lock-session" (wlogout, SUPER+L)
    before_sleep_cmd = loginctl lock-session    # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # encender la pantalla al despertar
}

# 2.5 min: bajar el brillo
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min: bloquear
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: apagar la pantalla
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 min: suspender
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
