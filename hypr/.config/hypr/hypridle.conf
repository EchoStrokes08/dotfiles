#  HYPRIDLE · qué pasa cuando no tocas el equipo
#  Línea de tiempo:  29:30 baja el brillo (aviso) → 30:00 bloquea → 30:30 apaga la pantalla → 1:00 h suspende
#  Ojo: con la config en Lua, "hyprctl dispatch" espera una expresión Lua (hl.dsp.dpms{…}), no "dpms off".
general {
    # Bloqueo propio de Quickshell; si qs no responde, hyprlock de respaldo
    lock_cmd = ~/.config/hypr/scripts/bloquear.sh               # "loginctl lock-session" (wlogout, SUPER+L)
    inhibit_sleep = 3                                           # no suspender hasta que el bloqueo esté puesto
    before_sleep_cmd = loginctl lock-session                    # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # encender la pantalla al despertar
}

# 29 min 30 s: bajar el brillo (aviso: mueve el ratón y vuelve)
listener {
    timeout = 1770
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 30 min: bloquear
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# 30 min 30 s: apagar la pantalla
listener {
    timeout = 1830
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 1 h: suspender
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
