# hyprsunset: luz nocturna (filtro cálido de pantalla). Lo arranca autostart.lua.
# Cambia SOLO a las horas de cada "profile". Entre medias, SUPER+ALT+N lo enciende/apaga a mano
# (scripts/luz-nocturna.sh) hasta el siguiente cambio de perfil.
# Temperatura en Kelvin: 6500 = neutra, 4500 = cálida, 3500 = muy cálida.

max-gamma = 150

# De día: sin filtro (identity = colores reales, imprescindible para editar fotos o elegir colores)
profile {
    time = 7:00
    identity = true
}

# De noche: cálido. Menos luz azul = menos te despierta antes de dormir
profile {
    time = 20:30
    temperature = 4500
}
