#  HYPRIDLE · con batería: más corto para ahorrar
#  Línea de tiempo:  3 min baja el brillo → 5 min bloquea → 6 min apaga la pantalla → 15 min suspende
#  Lo elige scripts/inactividad.sh (al iniciar sesión y al enchufar/desenchufar, desde Cargador.qml).
#  Ojo: con la config en Lua, "hyprctl dispatch" espera una expresión Lua (hl.dsp.dpms{…}), no "dpms off".
general {
    # Bloqueo propio de Quickshell; si qs no responde, hyprlock de respaldo
    lock_cmd = ~/.config/hypr/scripts/bloquear.sh               # "loginctl lock-session" (wlogout, SUPER+L)
    inhibit_sleep = 3                                           # no suspender hasta que el bloqueo esté puesto
    before_sleep_cmd = loginctl lock-session                    # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # encender la pantalla al despertar
}

# 3 min: bajar el brillo (aviso: mueve el ratón y vuelve)
listener {
    timeout = 180
    on-timeout = ~/.config/hypr/scripts/atenuar.sh
    on-resume = brightnessctl -c backlight -r
}

# 5 min: bloquear
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: apagar la pantalla
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15 min: suspender
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
